<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101714">
  <title>Iniciar sesión | PalmaClo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles/style.css">
  <script src="/assets/scripts/login.js?v=2" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="brand-title">
      <a class="wordmark" href="/login" aria-label="PalmaClo, inicio">PALMACLO<span>.</span></a>
      <p class="eyebrow">TIENDA DE ROPA URBANA</p>
      <h1 id="brand-title">Qué bueno<br>tenerte de vuelta.</h1>
      <p class="login-copy">Iniciá sesión para administrar tu tienda. También podés recorrer la colección sin una cuenta.</p>

      <form id="loginForm" class="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" placeholder="nombre@correo.com" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" placeholder="Tu contraseña" required>
        <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>
        <button id="loginButton" class="button button-dark button-wide" type="submit">Ingresar <span aria-hidden="true">→</span></button>
      </form>

      <a class="login-store-link" href="/">Explorar la tienda <span aria-hidden="true">↗</span></a>
      <p class="login-footnote">Acceso seguro a tu cuenta PalmaClo.</p>
    </section>
    <aside class="login-visual" aria-label="Colección PalmaClo">
      <div class="visual-overlay"></div>
      <div class="visual-copy">
        <span class="visual-kicker">NUEVA TEMPORADA</span>
        <p>Vestite<br>como sos.</p>
      </div>
      <span class="visual-index">PALMACLO / 01</span>
    </aside>
  </main>
</body>
</html>
